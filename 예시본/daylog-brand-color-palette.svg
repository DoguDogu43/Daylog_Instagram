<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1800" viewBox="0 0 1800 1800" role="img" aria-labelledby="title desc">
  <title id="title">데이로그 브랜드 컬러 팔레트</title>
  <desc id="desc">Deep Navy, Warm Ivory, Growth Yellow, Sage Green 핵심색과 Soft Beige, Charcoal, Clean White 보조색의 HEX, RGB, 사용처를 정리한 브랜드 컬러 보드</desc>
  <defs>
    <radialGradient id="background" cx="50%" cy="0%" r="90%">
      <stop offset="0" stop-color="#243149" />
      <stop offset="0.48" stop-color="#121721" />
      <stop offset="1" stop-color="#0D1017" />
    </radialGradient>
    <radialGradient id="navy-swatch" cx="50%" cy="10%" r="85%">
      <stop offset="0" stop-color="#2A3A57" />
      <stop offset="0.6" stop-color="#172033" />
      <stop offset="1" stop-color="#111827" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.34" />
    </filter>
    <style>
      .sans { font-family: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", Menlo, Consolas, monospace; }
      .card { fill: #11141B; stroke: #FFFFFF; stroke-opacity: .16; }
      .label { fill: #FFFFFF; font-size: 27px; font-weight: 700; letter-spacing: -0.5px; }
      .role { font-size: 15px; font-weight: 700; letter-spacing: 1.3px; }
      .rule { stroke: #FFFFFF; stroke-opacity: .16; }
      .value-key { fill: #FFFFFF; fill-opacity: .55; font-size: 16px; }
      .value { fill: #FFFFFF; fill-opacity: .78; font-size: 17px; }
      .usage { fill: #FFFFFF; fill-opacity: .76; font-size: 16px; }
      .support-name { fill: #FFFFFF; font-size: 21px; font-weight: 700; }
      .support-meta { fill: #FFFFFF; fill-opacity: .58; font-size: 14px; }
    </style>
  </defs>

  <rect width="1800" height="1800" fill="url(#background)" />
  <g transform="translate(0 275)">
  <circle cx="750" cy="77" r="7" fill="#F5B82E" />
  <path d="M750 55v44M728 77h44" stroke="#F5B82E" stroke-width="5" stroke-linecap="round" />
  <circle cx="1050" cy="77" r="7" fill="#F5B82E" />
  <path d="M1050 55v44M1028 77h44" stroke="#F5B82E" stroke-width="5" stroke-linecap="round" />
  <text x="900" y="90" class="sans" fill="#FFFFFF" font-size="56" font-weight="800" text-anchor="middle" letter-spacing="-2">데이로그</text>
  <text x="900" y="130" class="sans" fill="#FFFFFF" fill-opacity=".88" font-size="18" font-weight="600" text-anchor="middle" letter-spacing="5">BRAND COLOR PALETTE</text>

  <!-- Deep Navy -->
  <g filter="url(#shadow)">
    <rect x="70" y="180" width="397" height="755" rx="28" class="card" />
    <path d="M98 180h341a28 28 0 0 1 28 28v402H70V208a28 28 0 0 1 28-28Z" fill="url(#navy-swatch)" />
  </g>
  <circle cx="110" cy="660" r="15" fill="#172033" stroke="#FFFFFF" stroke-opacity=".24" />
  <text x="140" y="669" class="sans label">Deep Navy</text>
  <text x="140" y="696" class="sans role" fill="#F5B82E">PRIMARY · TRUST</text>
  <line x1="98" y1="726" x2="439" y2="726" class="rule" />
  <text x="98" y="766" class="mono value-key">HEX</text>
  <text x="439" y="766" class="mono value" text-anchor="end">#172033</text>
  <text x="98" y="801" class="mono value-key">RGB</text>
  <text x="439" y="801" class="mono value" text-anchor="end">23, 32, 51</text>
  <line x1="98" y1="828" x2="439" y2="828" class="rule" />
  <text x="98" y="869" class="sans usage">로고 · 헤더 · 제목 · 핵심 섹션</text>

  <!-- Warm Ivory -->
  <g filter="url(#shadow)">
    <rect x="491" y="180" width="397" height="755" rx="28" class="card" />
    <path d="M519 180h341a28 28 0 0 1 28 28v402H491V208a28 28 0 0 1 28-28Z" fill="#FFF9EF" />
  </g>
  <circle cx="531" cy="660" r="15" fill="#FFF9EF" stroke="#FFFFFF" stroke-opacity=".24" />
  <text x="561" y="669" class="sans label">Warm Ivory</text>
  <text x="561" y="696" class="sans role" fill="#FFF9EF">PRIMARY · WARMTH</text>
  <line x1="519" y1="726" x2="860" y2="726" class="rule" />
  <text x="519" y="766" class="mono value-key">HEX</text>
  <text x="860" y="766" class="mono value" text-anchor="end">#FFF9EF</text>
  <text x="519" y="801" class="mono value-key">RGB</text>
  <text x="860" y="801" class="mono value" text-anchor="end">255, 249, 239</text>
  <line x1="519" y1="828" x2="860" y2="828" class="rule" />
  <text x="519" y="869" class="sans usage">기본 배경 · 넓은 여백 · 따뜻한 대화</text>

  <!-- Growth Yellow -->
  <g filter="url(#shadow)">
    <rect x="912" y="180" width="397" height="755" rx="28" class="card" />
    <path d="M940 180h341a28 28 0 0 1 28 28v402H912V208a28 28 0 0 1 28-28Z" fill="#F5B82E" />
  </g>
  <circle cx="952" cy="660" r="15" fill="#F5B82E" stroke="#FFFFFF" stroke-opacity=".24" />
  <text x="982" y="669" class="sans label">Growth Yellow</text>
  <text x="982" y="696" class="sans role" fill="#F5B82E">ACCENT · ACTION</text>
  <line x1="940" y1="726" x2="1281" y2="726" class="rule" />
  <text x="940" y="766" class="mono value-key">HEX</text>
  <text x="1281" y="766" class="mono value" text-anchor="end">#F5B82E</text>
  <text x="940" y="801" class="mono value-key">RGB</text>
  <text x="1281" y="801" class="mono value" text-anchor="end">245, 184, 46</text>
  <line x1="940" y1="828" x2="1281" y2="828" class="rule" />
  <text x="940" y="869" class="sans usage">CTA · 체크 · 숫자 · 밑줄 · 핵심 강조</text>

  <!-- Sage Green -->
  <g filter="url(#shadow)">
    <rect x="1333" y="180" width="397" height="755" rx="28" class="card" />
    <path d="M1361 180h341a28 28 0 0 1 28 28v402h-397V208a28 28 0 0 1 28-28Z" fill="#879A7B" />
  </g>
  <circle cx="1373" cy="660" r="15" fill="#879A7B" stroke="#FFFFFF" stroke-opacity=".24" />
  <text x="1403" y="669" class="sans label">Sage Green</text>
  <text x="1403" y="696" class="sans role" fill="#879A7B">ACCENT · GROWTH</text>
  <line x1="1361" y1="726" x2="1702" y2="726" class="rule" />
  <text x="1361" y="766" class="mono value-key">HEX</text>
  <text x="1702" y="766" class="mono value" text-anchor="end">#879A7B</text>
  <text x="1361" y="801" class="mono value-key">RGB</text>
  <text x="1702" y="801" class="mono value" text-anchor="end">135, 154, 123</text>
  <line x1="1361" y1="828" x2="1702" y2="828" class="rule" />
  <text x="1361" y="869" class="sans usage">습관 · 안정 · 변화 결과 · 성장 영역</text>

  <!-- Supporting colors -->
  <g>
    <rect x="70" y="975" width="540" height="155" rx="22" fill="#141822" stroke="#FFFFFF" stroke-opacity=".14" />
    <rect x="90" y="995" width="120" height="115" rx="15" fill="#EDE1CF" />
    <text x="238" y="1027" class="sans support-name">Soft Beige</text>
    <text x="238" y="1058" class="mono support-meta">#EDE1CF · RGB 237, 225, 207</text>
    <text x="238" y="1090" class="sans support-meta">카드 · 구분 영역 · 보조 배경</text>
  </g>
  <g>
    <rect x="630" y="975" width="540" height="155" rx="22" fill="#141822" stroke="#FFFFFF" stroke-opacity=".14" />
    <rect x="650" y="995" width="120" height="115" rx="15" fill="#252525" stroke="#FFFFFF" stroke-opacity=".16" />
    <text x="798" y="1027" class="sans support-name">Charcoal</text>
    <text x="798" y="1058" class="mono support-meta">#252525 · RGB 37, 37, 37</text>
    <text x="798" y="1090" class="sans support-meta">본문 · 정보성 텍스트</text>
  </g>
  <g>
    <rect x="1190" y="975" width="540" height="155" rx="22" fill="#141822" stroke="#FFFFFF" stroke-opacity=".14" />
    <rect x="1210" y="995" width="120" height="115" rx="15" fill="#FFFFFF" />
    <text x="1358" y="1027" class="sans support-name">Clean White</text>
    <text x="1358" y="1058" class="mono support-meta">#FFFFFF · RGB 255, 255, 255</text>
    <text x="1358" y="1090" class="sans support-meta">카드 · 네이비 배경 위 텍스트</text>
  </g>

  <text x="900" y="1194" class="sans" fill="#FFFFFF" fill-opacity=".54" font-size="15" text-anchor="middle">권장 시각 비중  ·  Warm Ivory 70%  ·  Deep Navy 20%  ·  Growth Yellow 10%  ·  Sage Green은 제한적으로 사용</text>
  </g>
</svg>
